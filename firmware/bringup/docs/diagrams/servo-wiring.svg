<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 910" role="img" aria-label="双舵机：外部5V供电，GPIO18/GPIO15信号，共地" style="font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif"><title>双舵机：外部5V供电，GPIO18/GPIO15信号，共地</title><rect width="1240" height="910" fill="#f5f8fa"/><text x="50" y="57" font-size="30" fill="#192a3b" font-weight="700" >03  双舵机，GPIO18 + GPIO15</text><text x="50" y="94" font-size="20" fill="#b0412d" font-weight="600" >先断电并拆下屏幕的全部接线，再将外部电源调到 5.0 V。</text><rect x="50" y="131" width="540" height="109" rx="14" fill="#fff" stroke="#dce4ea"/><text x="75" y="173" font-size="24" fill="#192a3b" font-weight="600" >开发板继续用电脑 USB 供电</text><text x="75" y="211" font-size="18" fill="#627283" font-weight="400" >只引出 GPIO18 / GPIO15 和 GND，不给舵机供电</text><rect x="614" y="131" width="576" height="109" rx="14" fill="#fff4ee" stroke="#edc5b7"/><text x="639" y="173" font-size="24" fill="#b0412d" font-weight="600" >外部电源稳压 5.0 V → 两个舵机</text><text x="639" y="211" font-size="18" fill="#884d40" font-weight="400" >两根红线并联取 5V；GND 必须与开发板共地</text><text x="67" y="299" font-size="20" fill="#192a3b" font-weight="700" >接到哪里</text><text x="853" y="299" font-size="20" fill="#192a3b" font-weight="700" >MG90S 三根线</text><rect x="50" y="330" width="480" height="58" rx="8" fill="#fff" stroke="#dce4ea"/><text x="68" y="366" font-size="20" fill="#2c65b7" font-weight="500" >GPIO18（R8）· 舵机1 信号</text><path d="M530 359 H817" stroke="#2c65b7" stroke-width="4"/><circle cx="530" cy="359" r="6" fill="#2c65b7"/><circle cx="817" cy="359" r="6" fill="#2c65b7"/><rect x="817" y="330" width="373" height="58" rx="8" fill="#fff" stroke="#dce4ea"/><text x="835" y="366" font-size="20" fill="#2c65b7" font-weight="600" >信号 S · 常见橙 / 黄 / 白</text><rect x="50" y="400" width="480" height="58" rx="8" fill="#fff" stroke="#dce4ea"/><text x="68" y="436" font-size="20" fill="#3b7fd4" font-weight="500" >GPIO15（R5）· 舵机2 信号</text><path d="M530 429 H817" stroke="#3b7fd4" stroke-width="4"/><circle cx="530" cy="429" r="6" fill="#3b7fd4"/><circle cx="817" cy="429" r="6" fill="#3b7fd4"/><rect x="817" y="400" width="373" height="58" rx="8" fill="#fff" stroke="#dce4ea"/><text x="835" y="436" font-size="20" fill="#3b7fd4" font-weight="600" >信号 S · 常见橙 / 黄 / 白</text><rect x="50" y="470" width="480" height="58" rx="8" fill="#fff" stroke="#dce4ea"/><text x="68" y="506" font-size="20" fill="#d04d38" font-weight="500" >外部 5.0 V 正极（两舵机并联）</text><path d="M530 499 H817" stroke="#d04d38" stroke-width="4"/><circle cx="530" cy="499" r="6" fill="#d04d38"/><circle cx="817" cy="499" r="6" fill="#d04d38"/><rect x="817" y="470" width="373" height="58" rx="8" fill="#fff" stroke="#dce4ea"/><text x="835" y="506" font-size="20" fill="#d04d38" font-weight="600" >正极 + · 常见红色</text><rect x="50" y="540" width="480" height="58" rx="8" fill="#fff" stroke="#dce4ea"/><text x="68" y="576" font-size="20" fill="#475569" font-weight="500" >电源负极 + 开发板 GND（R9）</text><path d="M530 569 H817" stroke="#475569" stroke-width="4"/><circle cx="530" cy="569" r="6" fill="#475569"/><circle cx="817" cy="569" r="6" fill="#475569"/><rect x="817" y="540" width="373" height="58" rx="8" fill="#fff" stroke="#dce4ea"/><text x="835" y="576" font-size="20" fill="#475569" font-weight="600" >负极 − · 常见棕 / 黑</text><rect x="50" y="668" width="1140" height="200" rx="14" fill="#eaf4f1" stroke="#bfdace"/><text x="75" y="706" font-size="22" fill="#166253" font-weight="700" >两个舵机都先卸下舵盘和腿，固定舵机本体。</text><text x="75" y="745" font-size="20" fill="#192a3b" font-weight="400" >USB → 确认 PASSIVE → 开 5V → servo arm → servo pulse 1100 / 1900（两路一起）</text><text x="75" y="782" font-size="20" fill="#192a3b" font-weight="400" >只动一路：servo pulse 0 1100 ／ servo pulse 1 1900；允许 1000–2000μs。</text><text x="75" y="819" font-size="18" fill="#192a3b" font-weight="400" >10 秒无有效控制命令停止 PWM；stop / ! 可提前停止。停止 PWM 不会切断舵机电源。</text><text x="50" y="893" font-size="17" fill="#627283" font-weight="400" >GPIO18/GPIO15 是桌面试验脚；整机八舵机仍走 PCA9685。颜色仅供参考，以实际插头定义为准。</text></svg>