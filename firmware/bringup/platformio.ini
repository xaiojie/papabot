; LCKFB ESP32S3R8N8: 8 MB Quad Flash + 8 MB Octal PSRAM.
;
; Two console environments; both use the same pins, drivers and wiring checks.
;   lckfb_s3_bringup (default): Serial -> UART0 -> on-board CH340K.
;       Needs a macOS CH34x driver; this is the configuration the delivery
;       package and verification record were built and hashed against.
;   lckfb_s3_usbjtag: Serial -> USB-Serial/JTAG on the native USB connector.
;       No driver install needed on macOS; use the /dev/cu.usbmodem* port.
;       This environment deliberately does NOT run scripts/export_firmware.py,
;       so it cannot overwrite the verified artifacts/firmware delivery.
;
; Flash either one with, for example:
;   bash scripts/pio.sh run -e lckfb_s3_usbjtag -t upload --upload-port /dev/cu.usbmodemXXXX
[platformio]
default_envs = lckfb_s3_bringup

[env:lckfb_s3_bringup]
platform = espressif32@6.12.0
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    platformio/tool-esptoolpy@2.40900.250804
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wextra
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/Adafruit BusIO@1.17.0
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_protocol = esptool
upload_speed = 460800
extra_scripts =
    pre:scripts/prebuild.py
    post:scripts/export_firmware.py

; Console over the ESP32-S3 USB-Serial/JTAG peripheral (native USB port).
; build_flags is repeated in full on purpose: the base environment defines
; ARDUINO_USB_CDC_ON_BOOT=0, and inheriting it would put two conflicting -D
; defines for the same macro on the command line.
[env:lckfb_s3_usbjtag]
extends = env:lckfb_s3_bringup
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wextra
extra_scripts =
    pre:scripts/prebuild.py
