<text x="43" y="555" class="m">8.4V时2.084V；1%最坏约2.116V</text>
<text x="43" y="582" class="m">等效阻抗24.8kΩ；RC约2.48ms</text>
<text x="43" y="609" class="m">ADC衰减、校准、断电注入仍需核验</text>
<text x="43" y="636" class="m">JP2初次断开；确认ADC电压后接通</text>
<text x="30" y="807" class="s">共地并不意味着共用细回路线：舵机与功放返回各自电源支路，ADC地就近接主控安静地。</text>
<text x="30" y="842" class="s">USB首次烧录：取下主控单独接USB；装机电池供电时勿插USB。JP1/JP2为可断线桥，初次均断开。</text>
<text x="30" y="872" class="s">厂家图已证实USB VBUS与5V排针直连；JP1/JP2不是自动隔离，外供一颗二极管不能保护电脑。</text>
<text x="30" y="907" class="s">首版关机充电。保险座、动力铜路/线径、支路插针额定、模块温升、充电电流与反向漏电都需进入后续检查。</text>
