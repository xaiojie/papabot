; 桌面助手 · 应用固件（两个程序：表情 + 信息面板）
; 与 bench-v1 的分工：bench-v1 只做硬件接口自检，这个工程做真正的产品界面。
; 板级配置与 bench-v1 保持一致，便于两边交叉验证。
; **唯一例外是分区表**：本工程要装三部 GIF 动画，3.2 MB 的 app 分区不够，
; 改用 partitions-assistant-8mb.csv（单 app 6.875 MB，去掉没人用的 OTA 双 app 和 spiffs）。
; nvs 偏移与默认表一致，所以 Wi-Fi 凭据不受影响。详见该 csv 里的注释。
;
;   lckfb_s3_assistant   默认：Serial -> UART0 -> 板载 CH340K（需 macOS CH34x 驱动）
;   lckfb_s3_usbjtag     控制台走原生 USB（USB-Serial/JTAG），不需要装驱动
;
; 烧录：
;   bash scripts/pio.sh run -e lckfb_s3_usbjtag -t upload --upload-port /dev/cu.usbmodemXXXX
[platformio]
default_envs = lckfb_s3_assistant

[env:lckfb_s3_assistant]
platform = espressif32@6.12.0
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    platformio/tool-esptoolpy@2.40900.250804
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions-assistant-8mb.csv
board_upload.flash_size = 8MB
build_unflags = -std=gnu++11
board_build.embed_files =
    data/cjk16.bin
    data/cjk24.bin
    data/anim.bin
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    ; TLS 握手在默认 8 KB 的 loopTask 栈上会溢出
    -DARDUINO_LOOP_STACK_SIZE=16384
    -Wall
    -Wextra
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/Adafruit BusIO@1.17.0
    bblanchon/ArduinoJson@^7.0.4
    ; WebSocket 客户端 —— 连 papa.papaclaoud.top 的中转服务
    links2004/WebSockets@^2.6.1
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_protocol = esptool
upload_speed = 460800
extra_scripts =
    pre:scripts/prebuild.py

[env:lckfb_s3_usbjtag]
extends = env:lckfb_s3_assistant
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    ; TLS 握手在默认 8 KB 的 loopTask 栈上会溢出
    -DARDUINO_LOOP_STACK_SIZE=16384
    -Wall
    -Wextra
