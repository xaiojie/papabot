<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 650" role="img" aria-label="开发板自检：仅连接电脑USB" style="font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif"><title>开发板自检：仅连接电脑USB</title><rect width="1240" height="650" fill="#f5f8fa"/><text x="50" y="57" font-size="30" fill="#192a3b" font-weight="700" >01  只测试开发板</text><text x="50" y="94" font-size="19" fill="#627283" font-weight="400" >先确认烧录、串口和主控正常，再接屏幕与舵机。</text><rect x="60" y="155" width="375" height="200" rx="14" fill="#fff" stroke="#dce4ea"/><text x="91" y="205" font-size="30" fill="#192a3b" font-weight="700" >电脑</text><text x="91" y="254" font-size="22" fill="#192a3b" font-weight="400" >复用现有 USB 数据线</text><text x="91" y="297" font-size="20" fill="#627283" font-weight="400" >UART0 / CH340 · 115200</text><path d="M435 254 H798" fill="none" stroke="#2c65b7" stroke-width="6"/><text x="535" y="233" font-size="19" fill="#2c65b7" font-weight="400" >USB 数据 + 供电</text><rect x="798" y="155" width="382" height="200" rx="14" fill="#eaf4f1" stroke="#bfdace"/><text x="827" y="205" font-size="25" fill="#166253" font-weight="600" >立创 ESP32S3R8N8</text><text x="827" y="252" font-size="23" fill="#192a3b" font-weight="400" >USB-C 插口</text><text x="827" y="298" font-size="18" fill="#536775" font-weight="400" >8MB Flash + 8MB OPI PSRAM</text><rect x="60" y="400" width="1120" height="187" rx="14" fill="#fff" stroke="#dce4ea"/><text x="87" y="440" font-size="24" fill="#192a3b" font-weight="600" >这一步不接外部电源、屏幕或舵机。</text><text x="87" y="481" font-size="21" fill="#192a3b" font-weight="400" >烧录后打开串口，依次输入：help → selftest → wifi scan</text><text x="87" y="520" font-size="21" fill="#192a3b" font-weight="400" >观察 LED 闪烁；正常启动后按 BOOT，检查串口计数。</text><text x="87" y="559" font-size="18" fill="#627283" font-weight="400" >预期：芯片 / Flash / PSRAM 信息与自检结果；这是到货后的验收项目。</text><text x="60" y="625" font-size="17" fill="#627283" font-weight="400" >程序编译验证与实物测试分开记录；现在没有连接或烧录任何开发板。</text></svg>