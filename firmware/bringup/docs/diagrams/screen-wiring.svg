<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1110" role="img" aria-label="屏幕与控件：外部3.3V，12针逐根连接" style="font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif"><title>屏幕与控件：外部3.3V，12针逐根连接</title><rect width="1240" height="1110" fill="#f5f8fa"/><text x="50" y="57" font-size="30" fill="#192a3b" font-weight="700" >02  屏幕、旋钮和按键</text><text x="50" y="94" font-size="18" fill="#627283" font-weight="400" >逐针连接示意 · 左侧按功能排列，不代表开发板实物针序</text><rect x="50" y="126" width="544" height="99" rx="14" fill="#fff" stroke="#dce4ea"/><text x="75" y="164" font-size="24" fill="#192a3b" font-weight="600" >电脑 USB → 开发板 USB-C</text><text x="75" y="199" font-size="17" fill="#627283" font-weight="400" >主控由 USB 供电，3V3 / 5V 排针不接外部正极</text><rect x="618" y="126" width="572" height="99" rx="14" fill="#fff4ee" stroke="#edc5b7"/><text x="642" y="164" font-size="24" fill="#b0412d" font-weight="600" >可调电源 → 稳压 3.3 V</text><text x="642" y="199" font-size="17" fill="#884d40" font-weight="400" >VCC、BLK 接同一正极；负极与开发板共地</text><text x="65" y="279" font-size="20" fill="#192a3b" font-weight="700" >接到哪里</text><text x="870" y="279" font-size="20" fill="#192a3b" font-weight="700" >屏幕模块 12 针</text><g data-wire="1" class="wire"><rect x="50" y="297" width="480" height="40" rx="7" fill="#fff" stroke="#e0e6eb"/><text x="67" y="324" font-size="19" fill="#475569" font-weight="500" >电源负极 + 开发板 GND（L7）</text><path d="M530 317 H855" fill="none" stroke="#475569" stroke-width="3"/><circle cx="530" cy="317" r="5" fill="#475569"/><circle cx="855" cy="317" r="5" fill="#475569"/><rect x="855" y="297" width="335" height="40" rx="7" fill="#fff" stroke="#e0e6eb"/><text x="873" y="324" font-size="20" fill="#475569" font-weight="600" >01  GND</text></g><g data-wire="2" class="wire"><rect x="50" y="343" width="480" height="40" rx="7" fill="#fff" stroke="#e0e6eb"/><text x="67" y="370" font-size="19" fill="#d04d38" font-weight="500" >外部 3.3 V 正极（同一路）</text><path d="M530 363 H855" fill="none" stroke="#d04d38" stroke-width="3"/><circle cx="530" cy="363" r="5" fill="#d04d38"/><circle cx="855" cy="363" r="5" fill="#d04d38"/><rect x="855" y="343" width="335" height="40" rx="7" fill="#fff" stroke="#e0e6eb"/><text x="873" y="370" font-size="20" fill="#d04d38" font-weight="600" >02  VCC</text></g><g data-wire="3" class="wire"><rect x="50" y="389" width="480" height="40" rx="7" fill="#fff" stroke="#e0e6eb"/><text x="67" y="416" font-size="19" fill="#2c65b7" font-weight="500" >开发板 GPIO12   ·   L13</text><path d="M530 409 H855" fill="none" stroke="#2c65b7" stroke-width="3"/><circle cx="530" cy="409" r="5" fill="#2c65b7"/><circle cx="855" cy="409" r="5" fill="#2c65b7"/><rect x="855" y="389" width="335" height="40" rx="7" fill="#fff" stroke="#e0e6eb"/><text x="873" y="416" font-size="20" fill="#2c65b7" font-weight="600" >03  SCL</text></g><g data-wire="4" class="wire"><rect x="50" y="435" width="480" height="40" rx="7" fill="#fff" stroke="#e0e6eb"/><text x="67" y="462" font-size="19" fill="#2c65b7" font-weight="500" >开发板 GPIO11   ·   L12</text><path d="M530 455 H855" fill="none" stroke="#2c65b7" stroke-width="3"/><circle cx="530" cy="455" r="5" fill="#2c65b7"/><circle cx="855" cy="455" r="5" fill="#2c65b7"/><rect x="855" y="435" width="335" height="40" rx="7" fill="#fff" stroke="#e0e6eb"/><text x="873" y="462" font-size="20" fill="#2c65b7" font-weight="600" >04  SDA</text></g><g data-wire="5" class="wire"><rect x="50" y="481" width="480" height="40" rx="7" fill="#fff" stroke="#e0e6eb"/><text x="67" y="508" font-size="19" fill="#2c65b7" font-weight="500" >开发板 GPIO21   ·   R10</text><path d="M530 501 H855" fill="none" stroke="#2c65b7" stroke-width="3"/><circle cx="530" cy="501" r="5" fill="#2c65b7"/><circle cx="855" cy="501" r="5" fill="#2c65b7"/><rect x="855" y="481" width="335" height="40" rx="7" fill="#fff" stroke="#e0e6eb"/><text x="873" y="508" font-size="20" fill="#2c65b7" font-weight="600" >05  RES</text></g><g data-wire="6" class="wire"><rect x="50" y="527" width="480" height="40" rx="7" fill="#fff" stroke="#e0e6eb"/><text x="67" y="554" font-size="19" fill="#2c65b7" font-weight="500" >开发板 GPIO14   ·   L15</text><path d="M530 547 H855" fill="none" stroke="#2c65b7" stroke-width="3"/><circle cx="530" cy="547" r="5" fill="#2c65b7"/><circle cx="855" cy="547" r="5" fill="#2c65b7"/><rect x="855" y="527" width="335" height="40" rx="7" fill="#fff" stroke="#e0e6eb"/><text x="873" y="554" font-size="20" fill="#2c65b7" font-weight="600" >06  DC</text></g><g data-wire="7" class="wire"><rect x="50" y="573" width="480" height="40" rx="7" fill="#fff" stroke="#e0e6eb"/><text x="67" y="600" font-size="19" fill="#2c65b7" font-weight="500" >开发板 GPIO13   ·   L14</text><path d="M530 593 H855" fill="none" stroke="#2c65b7" stroke-width="3"/><circle cx="530" cy="593" r="5" fill="#2c65b7"/><circle cx="855" cy="593" r="5" fill="#2c65b7"/><rect x="855" y="573" width="335" height="40" rx="7" fill="#fff" stroke="#e0e6eb"/><text x="873" y="600" font-size="20" fill="#2c65b7" font-weight="600" >07  CS</text></g><g data-wire="8" class="wire"><rect x="50" y="619" width="480" height="40" rx="7" fill="#fff" stroke="#e0e6eb"/><text x="67" y="646" font-size="19" fill="#d04d38" font-weight="500" >外部 3.3 V 正极（同一路）</text><path d="M530 639 H855" fill="none" stroke="#d04d38" stroke-width="3"/><circle cx="530" cy="639" r="5" fill="#d04d38"/><circle cx="855" cy="639" r="5" fill="#d04d38"/><rect x="855" y="619" width="335" height="40" rx="7" fill="#fff" stroke="#e0e6eb"/><text x="873" y="646" font-size="20" fill="#d04d38" font-weight="600" >08  BLK</text></g><g data-wire="9" class="wire"><rect x="50" y="665" width="480" height="40" rx="7" fill="#fff" stroke="#e0e6eb"/><text x="67" y="692" font-size="19" fill="#008773" font-weight="500" >开发板 GPIO7   ·   L8</text><path d="M530 685 H855" fill="none" stroke="#008773" stroke-width="3"/><circle cx="530" cy="685" r="5" fill="#008773"/><circle cx="855" cy="685" r="5" fill="#008773"/><rect x="855" y="665" width="335" height="40" rx="7" fill="#fff" stroke="#e0e6eb"/><text x="873" y="692" font-size="20" fill="#008773" font-weight="600" >09  A</text></g><g data-wire="10" class="wire"><rect x="50" y="711" width="480" height="40" rx="7" fill="#fff" stroke="#e0e6eb"/><text x="67" y="738" font-size="19" fill="#008773" font-weight="500" >开发板 GPIO2   ·   L2</text><path d="M530 731 H855" fill="none" stroke="#008773" stroke-width="3"/><circle cx="530" cy="731" r="5" fill="#008773"/><circle cx="855" cy="731" r="5" fill="#008773"/><rect x="855" y="711" width="335" height="40" rx="7" fill="#fff" stroke="#e0e6eb"/><text x="873" y="738" font-size="20" fill="#008773" font-weight="600" >10  B</text></g><g data-wire="11" class="wire"><rect x="50" y="757" width="480" height="40" rx="7" fill="#fff" stroke="#e0e6eb"/><text x="67" y="784" font-size="19" fill="#008773" font-weight="500" >开发板 GPIO38   ·   R13</text><path d="M530 777 H855" fill="none" stroke="#008773" stroke-width="3"/><circle cx="530" cy="777" r="5" fill="#008773"/><circle cx="855" cy="777" r="5" fill="#008773"/><rect x="855" y="757" width="335" height="40" rx="7" fill="#fff" stroke="#e0e6eb"/><text x="873" y="784" font-size="20" fill="#008773" font-weight="600" >11  PUSH</text></g><g data-wire="12" class="wire"><rect x="50" y="803" width="480" height="40" rx="7" fill="#fff" stroke="#e0e6eb"/><text x="67" y="830" font-size="19" fill="#008773" font-weight="500" >开发板 GPIO40   ·   R11</text><path d="M530 823 H855" fill="none" stroke="#008773" stroke-width="3"/><circle cx="530" cy="823" r="5" fill="#008773"/><circle cx="855" cy="823" r="5" fill="#008773"/><rect x="855" y="803" width="335" height="40" rx="7" fill="#fff" stroke="#e0e6eb"/><text x="873" y="830" font-size="20" fill="#008773" font-weight="600" >12  K0 / KEY0</text></g><rect x="50" y="890" width="1140" height="176" rx="14" fill="#eaf4f1" stroke="#bfdace"/><text x="75" y="926" font-size="21" fill="#166253" font-weight="700" >按这个顺序上电</text><text x="75" y="959" font-size="19" fill="#192a3b" font-weight="400" >接好线 → USB 上电 → 确认 PASSIVE → 开 3.3V → 输入 screen start</text><text x="75" y="993" font-size="19" fill="#192a3b" font-weight="400" >结束：stop → 关外部 3.3V → 拔 USB；改线前全部断电。</text><text x="75" y="1030" font-size="17" fill="#536775" font-weight="400" >SCL / SDA 是 SPI 时钟 / MOSI；RES 接 GPIO21；模块自带控件上拉。</text><text x="50" y="1093" font-size="15" fill="#627283" font-weight="400" >bench-v1 · 基于 RevB 屏幕接口表 · 仍须按实物丝印核对方向；没有测得最大背光电流。</text></svg>