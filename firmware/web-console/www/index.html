<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1a20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>爬爬 · 控制台</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#0e1a20; --card:#12232b; --line:#1e3a45; --line2:#173039;
    --eye:#6ad4e8; --eye-soft:#8fe3f2; --dim:#4b8f9c;
    --text:#cfe3d8; --muted:#8fa9b3; --ok:#7ddba0; --warn:#e8b96a; --err:#e8796a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--text); min-height:100svh;
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:640px;margin:0 auto;padding:16px}

  /* ---------- 顶部状态条 ---------- */
  header{
    display:flex;align-items:center;gap:10px;
    padding:12px 16px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:rgba(14,26,32,.92);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:10;
  }
  .logo{font-size:22px;line-height:1}
  .title{flex:1;font-size:15px;color:var(--eye);letter-spacing:.5px}
  .pill{
    font-size:12px;padding:3px 10px;border-radius:999px;
    border:1px solid var(--line);color:var(--muted);white-space:nowrap;
  }
  .pill.on{color:var(--ok);border-color:#2a5540;background:#122a1f}
  .pill.off{color:var(--err);border-color:#5a2e2a;background:#2a1614}

  /* ---------- 卡片 ---------- */
  .card{
    background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:16px;margin-bottom:14px;
  }
  h2{
    margin:0 0 12px;font-size:13px;font-weight:600;color:var(--eye-soft);
    letter-spacing:.8px;text-transform:uppercase;
  }

  /* ---------- 表单 ---------- */
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
  input{
    width:100%;padding:12px 14px;border-radius:10px;
    border:1px solid var(--line);background:#0b161b;color:var(--text);
    font-size:16px;font-family:inherit;
  }
  input:focus{outline:none;border-color:var(--dim)}
  button{
    padding:12px 18px;border-radius:10px;border:1px solid var(--line);
    background:#173039;color:var(--text);font-size:15px;font-family:inherit;
    cursor:pointer;transition:.15s;
  }
  button:active{transform:scale(.97)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .primary{background:var(--dim);border-color:var(--dim);color:#06171c;font-weight:600}
  .danger{border-color:#5a2e2a;color:var(--err)}
  .full{width:100%}

  /* ---------- 网格按钮 ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
  .grid button{padding:14px 6px;font-size:13px;line-height:1.3}
  .grid button.active{background:var(--dim);border-color:var(--dim);color:#06171c;font-weight:600}

  /* ---------- 画面预览 ---------- */
  #screen{
    width:100%;aspect-ratio:4/3;background:#000;border-radius:10px;
    border:1px solid var(--line);overflow:hidden;line-height:0;
  }
  #screen canvas{width:100%;height:100%;display:block;image-rendering:pixelated}

  /* ---------- 日志 ---------- */
  #log{
    font:12px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;
    background:#0b161b;border:1px solid var(--line);border-radius:10px;
    padding:12px;height:190px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;
  }
  .t-in{color:var(--eye-soft)} .t-out{color:var(--muted)}
  .t-ok{color:var(--ok)} .t-err{color:var(--err)} .t-sys{color:var(--dim)}

  /* ---------- 终端输入 ---------- */
  .row{display:flex;gap:8px;margin-top:10px}
  .row input{flex:1}

  .foot{text-align:center;color:#4a626c;font-size:12px;padding:8px 0 24px}
  .hint{color:var(--muted);font-size:12px;margin-top:8px}
  .hide{display:none!important}
</style>
</head>
<body>

<header>
  <div class="logo">◕‿◕</div>
  <div class="title">爬爬 · 控制台</div>
  <div class="pill" id="pill">未连接</div>
</header>

<div class="wrap">

  <!-- ============ 登录 ============ -->
  <div class="card" id="loginCard">
    <h2>登录</h2>
    <label for="u">账号</label>
    <input id="u" autocomplete="username" placeholder="papa">
    <label for="p">密码</label>
    <input id="p" type="password" autocomplete="current-password" placeholder="••••••••">
    <div style="height:14px"></div>
    <button class="primary full" id="loginBtn">登录</button>
    <div class="hint" id="loginHint"></div>
  </div>

  <!-- ============ 控制台 ============ -->
  <div id="console" class="hide">

    <div class="card">
      <h2>设备状态</h2>
      <div class="grid" style="grid-template-columns:1fr 1fr">
        <div><div class="hint">连接</div><div id="stDev">—</div></div>
        <div><div class="hint">当前屏幕</div><div id="stScreen">—</div></div>
        <div><div class="hint">表情</div><div id="stMood">—</div></div>
        <div><div class="hint">舵机</div><div id="stServo">—</div></div>
        <div><div class="hint">信号 / IP</div><div id="stNet">—</div></div>
        <div><div class="hint">内存</div><div id="stMem">—</div></div>
      </div>
      <div style="height:12px"></div>
      <button class="full" id="reconnectBtn">重新连接</button>
    </div>

    <div class="card">
      <h2>画面预览</h2>
      <div id="screen"><canvas id="cv"></canvas></div>
      <div class="hint" id="streamStat">未开始</div>
      <div style="height:10px"></div>
      <div class="grid" style="grid-template-columns:repeat(4,1fr)">
        <button data-cmd="cloud stream on 3">3 fps</button>
        <button data-cmd="cloud stream on 5">5 fps</button>
        <button data-cmd="cloud stream on 10">10 fps</button>
        <button data-cmd="cloud stream off">停止</button>
      </div>
    </div>

    <div class="card">
      <h2>屏幕</h2>
      <div class="grid" id="screens">
        <button data-cmd="screen face">表情</button>
        <button data-cmd="screen clock">数字钟</button>
        <button data-cmd="screen analog">表盘</button>
        <button data-cmd="screen weather">天气</button>
        <button data-cmd="screen chatgpt">额度</button>
        <button data-cmd="screen sys">状态</button>
        <button data-cmd="screen anim">动画</button>
      </div>
      <!-- 注：固定 6 屏用屏名切换最稳。动画屏用序号（screen 6/7…）
           依赖固件里 anim::count() 的实际数量，不稳定，所以只留一个入口。 -->
      <div style="height:10px"></div>
      <div class="grid" style="grid-template-columns:1fr 1fr">
        <button data-cmd="prev">← 上一屏</button>
        <button data-cmd="next">下一屏 →</button>
      </div>
      <div style="height:8px"></div>
      <div class="grid" style="grid-template-columns:repeat(4,1fr)">
        <button data-cmd="mood next">换表情</button>
        <button data-cmd="quota">刷新额度</button>
        <button data-cmd="weather">刷新天气</button>
        <button data-cmd="stats">性能</button>
      </div>
      <!-- 额度/天气在固件里是【定时自动刷新】：额度 5 分钟、天气 20 分钟。
           只有正看着对应屏时才重绘（数据本身一直在后台更新，
           切过去时看到的就是新的）。这两个按钮是「立刻刷」用的。 -->
    </div>

    <div class="card">
      <h2>终端</h2>
      <div id="log"></div>
      <div class="row">
        <input id="cmd" placeholder="输入命令，如 status / mood happy">
        <button id="sendBtn">发送</button>
      </div>
      <div class="hint">和设备串口命令完全一致，BLE/WiFi 都走同一条分发器</div>
    </div>

    <div class="card">
      <button class="danger full" id="logoutBtn">退出登录</button>
    </div>

  </div>

  <div class="foot">papa.papaclaoud.top</div>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const pill = $('pill'), logEl = $('log');

  let token = localStorage.getItem('papa_token') || '';
  let ws = null;
  let retry = 0;
  let alive = false;

  // 屏幕名 → 中文（必须与固件 apps::name() 完全一致，否则 `screen xxx` 会失败）
  //   固件：face / clock / analog / weather / chatgpt / sys / anim
  const SCREEN_CN = {
    face: '表情', clock: '数字钟', analog: '表盘', weather: '天气',
    chatgpt: '额度', sys: '状态', anim: '动画'
  };
  // 固件 kMoods = {"happy","curious","surprised","sleepy","sad"}
  const MOOD_CN = {
    happy: '开心', curious: '好奇', surprised: '惊讶', sleepy: '困', sad: '难过'
  };

  // ---------------- 日志 ----------------
  function log(text, cls = '') {
    const t = new Date().toLocaleTimeString('zh-CN', { hour12: false });
    const line = document.createElement('div');
    line.className = cls;
    line.textContent = `[${t}] ${text}`;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
    while (logEl.childNodes.length > 300) logEl.removeChild(logEl.firstChild);
  }

  // ---------------- 顶部状态 ----------------
  function setPill(text, cls) {
    pill.textContent = text;
    pill.className = 'pill' + (cls ? ' ' + cls : '');
  }

  // ---------------- 登录 ----------------
  async function login() {
    const username = $('u').value.trim();
    const password = $('p').value;
    if (!username || !password) { $('loginHint').textContent = '账号密码都要填'; return; }
    $('loginBtn').disabled = true;
    $('loginHint').textContent = '登录中…';
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      token = d.token;
      localStorage.setItem('papa_token', token);
      $('loginHint').textContent = '';
      $('p').value = '';
      showConsole();
    } catch (e) {
      $('loginHint').textContent = '❌ ' + e.message;
    } finally {
      $('loginBtn').disabled = false;
    }
  }

  function showConsole() {
    $('loginCard').classList.add('hide');
    $('console').classList.remove('hide');
    log('已登录', 't-ok');
    connect();
    // 进控制台就开画面预览（设备侧 5 fps 上限）
    setTimeout(() => { if (ws && ws.readyState === 1) send('cloud stream on 5'); }, 1200);
  }

  function logout() {
    localStorage.removeItem('papa_token');
    token = '';
    if (ws) { try { ws.close(); } catch {} ws = null; }
    $('console').classList.add('hide');
    $('loginCard').classList.remove('hide');
    setPill('未连接', '');
  }

  // ---------------- WebSocket ----------------
  function connect() {
    if (!token) return;
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const url = `${proto}://${location.host}/ws/client?token=${encodeURIComponent(token)}`;

    setPill('连接中…', '');
    log('连接中转服务…', 't-sys');

    try { ws = new WebSocket(url); } catch (e) { log('建立连接失败: ' + e.message, 't-err'); return; }
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => {
      retry = 0; alive = true;
      setPill('已连接', 'on');
      log('中转服务已连接', 't-ok');
    };

    ws.onmessage = (ev) => {
      if (typeof ev.data !== 'string') { onFrame(new Uint8Array(ev.data)); return; }
      let m; try { m = JSON.parse(ev.data); } catch { log('← ' + ev.data, 't-in'); return; }
      onMessage(m);
    };

    ws.onerror = () => log('连接出错', 't-err');

    ws.onclose = (e) => {
      alive = false;
      if (e.code === 1006 || e.code === 4401) {
        // 认证失败或异常断开
        if (retry === 0 && e.code === 1006) { /* 可能是 token 过期，先重试一次 */ }
      }
      setPill('已断开', 'off');
      log(`连接断开 (code ${e.code})`, 't-err');
      const delay = Math.min(1000 * Math.pow(2, retry++), 30000);
      if (retry <= 6) {
        log(`${delay / 1000}s 后重连…`, 't-sys');
        setTimeout(connect, delay);
      } else {
        log('重试次数过多，请点「重新连接」', 't-err');
      }
    };
  }

  function onMessage(m) {
    switch (m.type) {
      case 'welcome':
        log('服务端: ' + (m.server || 'ok'), 't-sys');
        break;
      case 'status':
        if ('deviceOnline' in m) {
          $('stDev').textContent = m.deviceOnline ? '在线 ✓' : '离线';
          $('stDev').style.color = m.deviceOnline ? 'var(--ok)' : 'var(--err)';
          if (!m.deviceOnline) {
            for (const k of ['stScreen','stMood','stServo','stNet','stMem']) $(k).textContent = '—';
          }
        }
        // 「设备上报的状态」和「中转给的在线状态」是两种 status，靠字段区分
        if (m.screen) {
          $('stScreen').textContent = SCREEN_CN[m.screen] || m.screen;
          markScreen(m.screen);
        }
        if (m.mood) $('stMood').textContent = MOOD_CN[m.mood] || m.mood;
        if (m.servo != null) {
          $('stServo').textContent = m.servo ? '已通电 ✓' : '未通电';
          $('stServo').style.color = m.servo ? 'var(--ok)' : 'var(--muted)';
        }
        if (m.rssi != null || m.ip) $('stNet').textContent = `${m.rssi ?? '?'}dBm ${m.ip ?? ''}`;
        if (m.heapKB != null) $('stMem').textContent = `堆 ${m.heapKB}KB / PSRAM ${m.psramKB ?? '?'}KB`;
        if (m.uptimeSec != null && !m.screen) $('stMem').textContent = `运行 ${fmtDur(m.uptimeSec)}`;
        log('状态: ' + JSON.stringify(m), 't-in');
        break;
      case 'error':
        log('⚠️ ' + (m.error || '未知错误'), 't-err');
        break;
      default:
        log('← ' + JSON.stringify(m), 't-in');
    }
  }

  function onFrame(u8) {
    // 帧格式 v2（与 firmware/assistant/src/cloud.cpp 的 sendFrameRLE 对齐）：
    //   [0]      = 1（RLE 全帧）
    //   [1]      = scale（像素块边长 1/2/3/4；画面已按此降采样）
    //   [2..3]   = width  uint16 LE（降采样后的宽）
    //   [4..5]   = height uint16 LE
    //   [6..7]   = runCount uint16 LE
    //   然后每组 4 字节：count uint16 LE + RGB565 uint16 LE
    //
    // scale 的意义：UI 屏 scale=1；GIF 动画是照片类画面，全分辨率有 3–4 万个 run
    // 装不下，固件会降采样后重发。这里把画布按 scale 放大画回去，保持原始尺寸显示。
    if (u8[0] !== 1) return;

    const scale = u8[1] || 1;
    const w = u8[2] | (u8[3] << 8);
    const h = u8[4] | (u8[5] << 8);
    const runs = u8[6] | (u8[7] << 8);
    if (!w || !h) return;

    const cv = $('cv'), ctx = cv.getContext('2d', { alpha: false });
    if (cv.width !== w || cv.height !== h) {
      cv.width = w; cv.height = h;
      imgData = ctx.createImageData(w, h);
      px32 = new Uint32Array(imgData.data.buffer);
      // 一次性建好 alpha 通道（小端：0xAABBGGRR）
      for (let i = 3; i < imgData.data.length; i += 4) imgData.data[i] = 255;
    }

    let p = 0, o = 8;
    for (let r = 0; r < runs; r++) {
      if (o + 3 >= u8.length) break;              // 数据截断，画到哪算哪
      const n = u8[o] | (u8[o + 1] << 8);
      const c = u8[o + 2] | (u8[o + 3] << 8);
      o += 4;
      // RGB565 → RGB888，并打包成小端的 0xAABBGGRR
      const R = ((c >> 11) & 0x1f) * 255 / 31 | 0;
      const G = ((c >> 5) & 0x3f) * 255 / 63 | 0;
      const B = (c & 0x1f) * 255 / 31 | 0;
      const c32 = (255 << 24) | (B << 16) | (G << 8) | R;
      const end = Math.min(p + n, px32.length);
      while (p < end) px32[p++] = c32;
    }

    ctx.putImageData(imgData, 0, 0);

    // 统计
    frames++; frameBytes += u8.length;
    lastFrameAt = Date.now();
    const now = lastFrameAt;
    if (now - lastFrameStat > 1000) {
      const fps = frames / ((now - streamStart) / 1000);
      $('streamStat').textContent =
        `${w * scale}×${h * scale}${scale > 1 ? ` (1/${scale})` : ''} · ` +
        `${(frameBytes / frames).toFixed(0)} B/帧 · ${fps.toFixed(1)} fps`;
      lastFrameStat = now;
    }
  }

  let imgData = null, px32 = null;
  let frames = 0, frameBytes = 0, streamStart = 0, lastFrameStat = 0, lastFrameAt = 0;

  function markScreen(name) {
    for (const b of $('screens').children) {
      b.classList.toggle('active', b.dataset.cmd === 'screen ' + name);
    }
  }

  function fmtDur(s) {
    if (s < 60) return s + ' 秒';
    if (s < 3600) return Math.floor(s / 60) + ' 分';
    if (s < 86400) return Math.floor(s / 3600) + ' 时 ' + Math.floor(s % 3600 / 60) + ' 分';
    return Math.floor(s / 86400) + ' 天';
  }

  // ---------------- 发命令 ----------------
  let seq = 0;
  function send(raw) {
    const cmd = String(raw || '').trim();
    if (!cmd) return;
    if (!ws || ws.readyState !== 1) { log('未连接，发不出去', 't-err'); return; }
    // 重新开流时把统计清零，否则 fps 算的是历史平均值
    if (cmd.startsWith('cloud stream on')) { frames = 0; frameBytes = 0; streamStart = Date.now(); }
    const msg = { type: 'cmd', id: 'c' + (++seq), cmd };
    ws.send(JSON.stringify(msg));
    log('→ ' + cmd, 't-out');
  }

  // ---------------- 事件绑定 ----------------
  $('loginBtn').onclick = login;
  $('u').addEventListener('keydown', e => { if (e.key === 'Enter') $('p').focus(); });
  $('p').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  $('logoutBtn').onclick = logout;
  $('reconnectBtn').onclick = () => {
    retry = 0;
    if (ws) { try { ws.close(); } catch {} }
    setTimeout(connect, 300);
  };
  $('sendBtn').onclick = () => { send($('cmd').value); $('cmd').value = ''; };
  $('cmd').addEventListener('keydown', e => {
    if (e.key === 'Enter') { send($('cmd').value); $('cmd').value = ''; }
  });
  $('screens').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    const cmd = b.dataset.cmd;
    // 乐观高亮：点下去立刻亮，不等设备回执。
    // 一个来回要 200~500ms，不这样做就会「不跟手」。
    // 如果设备其实没切过去，它下一次上报的状态会把高亮纠正回来。
    if (cmd.startsWith('screen ')) markScreen(cmd.slice(7));
    send(cmd);
  });

  // ---------------- 启动 ----------------
  // 推流看门狗：15 秒没收到帧就重新请求一次。
  // 设备重启、网页刚从后台回来、或上一次会话把流关了 —— 这些情况下
  // 没有它就会一直卡在最后一帧（实测踩过）。
  setInterval(() => {
    if (!ws || ws.readyState !== 1) return;
    if (lastFrameAt && Date.now() - lastFrameAt > 15000) {
      log('画面停了，重新请求推流…', 't-sys');
      send('cloud stream on 5');
      lastFrameAt = Date.now();          // 避免连续重发
    }
  }, 10000);

  if (token) {
    // 有 token，先验证一下再进控制台
    fetch('/api/status?token=' + encodeURIComponent(token))
      .then(r => { if (!r.ok) throw new Error(); return r.json(); })
      .then(() => showConsole())
      .catch(() => { localStorage.removeItem('papa_token'); token = ''; log('登录已过期，请重新登录', 't-err'); });
  } else {
    $('u').focus();
  }
})();
</script>
</body>
</html>
